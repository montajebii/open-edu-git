name: Frontend CI

on:
    push:
        branches: [main, develop]
        paths:
            - "frontend/**"
            - ".github/workflows/frontend-ci.yml"
    pull_request:
        branches: [main, develop]
        paths:
            - "frontend/**"

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Run type check
              run: npx tsc --noEmit

            - name: Run tests
              run: npm test --if-present

            - name: Build
              run: npm run build
              env:
                  NEXT_PUBLIC_API_URL: http://localhost:8000
