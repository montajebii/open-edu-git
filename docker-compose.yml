services:
  db:
    image: postgres:16
    container_name: openedu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openedu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openedu_password}
      POSTGRES_DB: ${POSTGRES_DB:-openedu_db}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openedu}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - openedu-net

  minio:
    image: minio/minio:latest
    container_name: openedu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - openedu-net

  redis:
    image: redis:7-alpine
    container_name: openedu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - openedu-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openedu-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-openedu}:${POSTGRES_PASSWORD:-openedu_password}@db:5432/${POSTGRES_DB:-openedu_db}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "false"
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here-change-in-production}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-your-email@example.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-your-email-password}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@openedugit.ir}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    networks:
      - openedu-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openedu-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - openedu-net

  setup:
    image: python:3.11-slim
    container_name: openedu-setup
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./scripts:/scripts
    command: sh -c "pip install minio && python /scripts/setup_minio_buckets.py"
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "false"
    networks:
      - openedu-net

volumes:
  pgdata:
  minio_data:
  redis_data:

networks:
  openedu-net:
    driver: bridge