[project]
name = "openedu-backend"
version = "0.1.0"
description = "OpenEdu Git Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.27.0",
    "sqlalchemy==2.0.25",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "passlib==1.7.4",
    "bcrypt==4.1.2",
    "python-jose==3.3.0",
    "minio==7.2.0",
    "pdfplumber==0.10.4",
    "python-docx==1.1.0",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "pydantic[email]==2.6.4",
    "httpx==0.27.0",
    "pytest==8.1.1",
    "pytest-asyncio==0.23.5",
    "pytest-cov==4.1.0",
    "sentry-sdk==1.40.6",
    "ruff==0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "migrations",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
